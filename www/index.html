<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis</title>

    <link rel="shortcut icon" href="assets/img/logoo.ico" type="image/x-icon">

    <!-- Bootsrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

    <!-- Bootsrap Icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Particle js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js"
        type="text/javascript"></script>

    <!--Textillate-->
    <link rel="stylesheet" href="assets/vendore/texllate/animate.css">

    <link rel="stylesheet" href="assets/vendore/texllate/style.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="UserGreeting" class="user-greeting text-light"></div>

    <div id="AuthOverlay" class="auth-overlay" hidden>
        <div class="auth-card">
            <h3 class="text-light mb-3">Welcome to Jarvis</h3>

            <form id="LoginForm" autocomplete="on">
                <input type="email" id="LoginEmail" class="form-control mb-2" placeholder="Email" autocomplete="username">
                <input type="password" id="LoginPassword" class="form-control mb-2" placeholder="Password" autocomplete="current-password">
                <button type="submit" id="LoginSubmitB" class="btn btn-primary w-100 mb-2">Log in</button>
                <div id="LoginError" class="text-danger small mb-2"></div>
                <p class="text-light small">No account yet? <a href="#" id="ShowSignupLink">Sign up</a></p>
            </form>

            <form id="SignupForm" autocomplete="on" hidden>
                <input type="text" id="SignupName" class="form-control mb-2" placeholder="Your name" autocomplete="name">
                <input type="email" id="SignupEmail" class="form-control mb-2" placeholder="Email" autocomplete="username">
                <input type="password" id="SignupPassword" class="form-control mb-2" placeholder="Password (min 6 characters)" autocomplete="new-password">
                <button type="submit" id="SignupSubmitB" class="btn btn-primary w-100 mb-2">Sign up</button>
                <div id="SignupError" class="text-danger small mb-2"></div>
                <p class="text-light small">Already have an account? <a href="#" id="ShowLoginLink">Log in</a></p>
            </form>
        </div>
    </div>

    <div class="container">

        <section id="Oval" class="mb-4">

            <div class="row">
                <div class="col-md-1"></div>
                <div class="col-md-10">
                    <div class="d-flex justify-content-center align-items-center" style="height:80vh;">
                        <canvas id="canvasOne" width="700" height="420" style="position: absolute;"></canvas>

                        <div id="JarvisHood">

                            <div class="square">
                                <span class="circle"></span>
                                <span class="circle"></span>
                                <span class="circle"></span>
                            </div>

                        </div>

                    </div>
                    <h5 class="text-light text text-center">What can I help with?</h5>

                    <div class="col-md-16"></div>
                    <div class="text-center"></div>
                    <div id="TextInput" class="d-flex">

                        <input type="text" class="input-field" name="Chatbox" id="Chatbox" placeholder="Ask anything..."
                            style="width: 90%">
                        <button id="MicB" class="glow-on-hover"><i class="bi bi-mic"></i></button>
                        <button id="ChatB" class="glow-on-hover"><i class="bi bi-chat-right-text"></i></button>
                        <button id="SettingsB" class="glow-on-hover" data-bs-toggle="modal" data-bs-target="#SettingsModal"><i class="bi bi-gear-wide-connected"></i></button>

                    </div>
                    <div id="ChatResponse" class="text-light text-center mt-3"></div>
                </div>
                <div class="col-md-1"></div>
            </div>

        </section>

        <section id="SiriWave" class="mb-4" hidden>

            <div class="container">
                <div class="row">
                    <div class="col-md-12">
                        <div class="d-flex justify-content-center align-items-center" style="height:100vh;">
                            <div class="">
                                <p class="text-center text-light mb-4 siri-message">yooooo!!! wsp wsp wsp gang</p>
                                <div id="siri-container"></div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

        </section>

    </div>

    <aside id="NotesPanel" class="notes-panel">
        <div class="notes-header">
            <strong>Notes</strong>
            <button id="NotesCloseB" class="notes-close-btn" aria-label="Close">&times;</button>
        </div>
        <div id="NotesStatus" class="notes-status"></div>

        <div class="notes-section-label">Raw transcript</div>
        <div id="NotesRaw" class="notes-raw"></div>

        <div class="notes-section-label">Organized notes</div>
        <pre id="NotesOrganized" class="notes-organized"></pre>

        <div class="notes-actions">
            <button id="NotesStopB" class="btn btn-sm btn-primary">Stop &amp; Organize</button>
            <button id="NotesCopyB" class="btn btn-sm btn-outline-light">Copy</button>
        </div>
    </aside>

    <div class="modal fade" id="SettingsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header">
                    <h5 class="modal-title">Settings</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="SpeakRepliesToggle" checked>
                        <label class="form-check-label" for="SpeakRepliesToggle">Speak replies out loud</label>
                    </div>

                    <label for="ApiKeyInput" class="form-label">Anthropic API key (this session only)</label>
                    <div class="d-flex mb-1" style="gap: 8px;">
                        <input type="password" class="form-control" id="ApiKeyInput" placeholder="sk-ant-...">
                        <button id="SaveApiKeyB" class="btn btn-sm btn-primary text-nowrap">Save</button>
                    </div>
                    <div id="AiStatus" class="small text-muted mb-3"></div>

                    <button id="LogoutB" class="btn btn-sm btn-outline-danger">Log out</button>
                </div>
            </div>
        </div>
    </div>

    <!--Jquery  -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <!-- Siriwave -->
    <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>

    <script src="script.js"></script>

    <!-- Textillate js -->
    <script src="assets/vendore/texllate/jquery.fittext.js"></script>
    <script src="assets/vendore/texllate/jquery.lettering.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/textillate@0.4.1/jquery.textillate.min.js"></script>

    <script src="main.js"></script>
    <script src="controller.js"></script>
    <script src="/eel.js"></script>

</body>

</html>
